  rationale: |
    UW_FLOW ingestion shows concerning lag: p50=287s (4.8 min), p95=1439s (24 min),
    max_gap=3773s (63 min). With a 15-minute lookback window for Alpaca data, flow signals
    could be based on data that is 4-24 minutes stale. This may explain the huge ML score
    variance between days (0.10 on March 30 vs 0.95 on March 31 from RAG context).
    Additionally, the ML prefilter rejection rate is extremely high (100% on March 30 with
    327 candidates all scoring 0.10), suggesting the flow data arriving late may be getting
    scored against already-moved prices, producing low-quality features.
