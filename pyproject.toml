[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion"
version = "0.1.0"
description = "Real-Time UW + Alpaca Data Lake + Signal Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "empire-core",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.31.0",
    "greenlet>=3.0.1",
    "python-dotenv>=1.0.0",
    "tenacity>=9.1.4",
    "pandas>=3.0.0",
    "openai>=2.45.0",
    "pgvector>=0.4.2",
    "structlog>=26.1.0",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "websockets>=16.1",
    "pyarrow>=23.0.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "exchange-calendars>=4.13.1",
    "scipy>=1.16.3",
    "numpy<3",
    "pyyaml>=6.0.3",
    "joblib>=1.5.3",
    "alpaca-py>=0.43.5",
    # alpaca-py imports pytz at module load (alpaca.data.requests) but does not
    # declare it — keep this pin even though orion's own code uses zoneinfo.
    "pytz>=2025.2",
    "aiofiles>=24.1.0",
    "prometheus-client>=0.25.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
    "black>=26.1.0",
    "mypy>=1.7.1",
    "aiosqlite>=0.22.0",
    "bandit>=1.9.4",
    "detect-secrets>=1.4.0",
    "pre-commit>=4.6.0",
]

[tool.uv.sources]
empire-core = { path = "../empire-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers -m \"not slow\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::DeprecationWarning:sqlalchemy.*:",
    "ignore::DeprecationWarning:pytest_asyncio.*:",
    "ignore::RuntimeWarning:sqlalchemy.*:",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no network)",
    "integration: Tests with real DB, file I/O, or component interactions",
    "e2e: End-to-end full system flow tests",
    "slow: Tests that take >1s (opt-in, excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend = "ruff-base.toml"
line-length = 120
extend-exclude = [
    "archive",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E402", "E501", "B008", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001", "F401", "F841"]
"alembic/versions/*.py" = ["I001", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = "(^archive/|^scripts/|^tests/|^alembic/)"
follow_imports = "skip"

# Type-checking tiers (later override wins on overlap):
#   Tier 0 — blanket exempt: legacy/unchecked modules (ignore_errors=true).
#   Tier 1 — full strict: known-clean greenfield modules.
#   Tier 2 — pragmatic checked: safety-critical execution/core packages —
#            real type checking (check_untyped_defs) minus strict flags that
#            would only flood noise on legacy SQLAlchemy/pydantic models.
# Tier 0: everything under orion.* is exempt unless a later override opts it in.
[[tool.mypy.overrides]]
module = ["orion.*"]
ignore_errors = true

# Tier 1: fully strict, must stay clean.
[[tool.mypy.overrides]]
module = [
    "orion.clients.heber_reader",
    "orion.main_feature_enrichment",
    "orion.jobs.gateway_contract_probe",
    # SQLAlchemy 2.0 typed-declarative models (R6 phase 1): every column is a
    # Mapped[...] annotation, so these are fully strict-clean. Keeping them at
    # tier 1 makes the detached-instance / nullability bug class statically
    # enforced — a Column-vs-value mismatch now fails the build.
    "orion.storage.models_execution",
    "orion.storage.models_risk",
    "orion.storage.models_gold",
    "orion.storage.models_dlq",
    # R6 phase 2 (RC.3): remaining legacy modules converted to typed-declarative.
    "orion.storage.models_ml",
    "orion.storage.models_silver",
    # Already-converted-but-unpromoted modules that pass strict cleanly.
    "orion.storage.models",
    "orion.storage.models_attribution",
    "orion.storage.models_audit",
    "orion.storage.models_flow_parity",
    "orion.storage.models_liveness",
    "orion.storage.models_signals",
    "orion.storage.models_trade_journal",
    # models_solvers left UNPROMOTED: MetaExperiment.prd_id returns Any
    # (`self.id or self.experiment_id`, no-any-return under follow_imports=skip)
    # — a real code change, out of scope for the mechanical conversion task.
]
ignore_errors = false
strict = true

# Tier 2: safety-critical packages — genuinely checked, pragmatically relaxed.
[[tool.mypy.overrides]]
module = [
    "orion.execution.*",
    "orion.core.*",
]
ignore_errors = false
strict = false
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = false
# follow_imports=skip (global) makes pydantic BaseModel / EmpireError / the
# shared @db_* decorators resolve to Any. The two flags below suppress the
# resulting "subclass of Any" and "untyped decorator" noise without masking
# real type errors in this package's own code.
disallow_subclassing_any = false
disallow_untyped_decorators = false
