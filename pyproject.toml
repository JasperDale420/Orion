[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "orion"
version = "0.1.0"
description = "Real-Time UW + Alpaca Data Lake + Signal Engine"
authors = ["Jacob McMillan <jacob@example.com>"]
readme = "README.md"
packages = [{include = "orion", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.31.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.23"
asyncpg = "^0.31.0"
greenlet = "^3.0.1"  # Required for async sqlalchemy
python-dotenv = "^1.0.0"
tenacity = "^8.2.3"
pandas = "^2.1.3"

openai = "^2.13.0"
pgvector = "^0.4.2"
loguru = "^0.7.2"
alembic = "^1.13.0"
httpx = "^0.28.1"
msgpack = "^1.0.3"
websockets = ">=10.4"
sseclient-py = "^1.9.0"
boto3 = "^1.34.0"
pyarrow = "^14.0.0"
s3fs = "^2025.12.0"
aiokafka = "^0.13.0"
fastapi = "^0.124.4"
uvicorn = "^0.38.0"
exchange-calendars = "^4.11.3"
pandera = "^0.27.1"
litellm = "^1.80.11"
scipy = "^1.16.3"
numpy = "<3"
pyyaml = "^6.0.3"
joblib = "^1.5.3"
alpaca-py = "^0.32.0"
prometheus-client = "^0.21.0"
lightgbm = "^4.5.0"
scikit-learn = "^1.6.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"
ruff = "^0.14.10"
black = "^25.12.0"
mypy = "^1.7.1"
types-requests = "^2.31.0.10"
aiosqlite = "^0.22.0"
bandit = "^1.7.5"
detect-secrets = "^1.4.0"
pre-commit = "^3.5.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::DeprecationWarning:sqlalchemy.*:",
    "ignore::DeprecationWarning:pytest_asyncio.*:"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E402", "E501", "B008"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
