[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "orion"
version = "0.1.0"
description = "Real-Time UW + Alpaca Data Lake + Signal Engine"
authors = ["Jacob McMillan <jacob@example.com>"]
readme = "README.md"
packages = [{include = "orion", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.31.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.13.0"
sqlalchemy = "^2.0.46"
asyncpg = "^0.31.0"
greenlet = "^3.0.1"  # Required for async sqlalchemy
python-dotenv = "^1.0.0"
tenacity = "^9.1.4"
pandas = "^3.0.1"

openai = "^2.21.0"
pgvector = "^0.4.2"
structlog = ">=24.1.0"
alembic = "^1.18.4"
httpx = "^0.28.1"
msgpack = "^1.0.3"
websockets = ">=10.4"
sseclient-py = "^1.9.0"
boto3 = "^1.42.0"
pyarrow = "^23.0.0"
s3fs = "^2026.2.0"
aiokafka = "^0.13.0"
fastapi = "^0.135.1"
uvicorn = "^0.41.0"
exchange-calendars = "^4.13.1"
pandera = "^0.29.0"
litellm = "^1.80.11"
scipy = "^1.17.1"
numpy = "<3"
pyyaml = "^6.0.3"
joblib = "^1.5.3"
alpaca-py = "^0.43.2"
prometheus-client = "^0.24.1"
lightgbm = "^4.5.0"
scikit-learn = "^1.6.0"
aiobotocore = "^3.2.1"
fsspec = "^2026.2.0"
pytz = "^2026.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.15.0"
black = "^26.1.0"
mypy = "^1.7.1"
types-requests = "^2.31.0.10"
aiosqlite = "^0.22.0"
bandit = "^1.9.4"
detect-secrets = "^1.4.0"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::DeprecationWarning:sqlalchemy.*:",
    "ignore::DeprecationWarning:pytest_asyncio.*:",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no network)",
    "integration: Tests with real DB, file I/O, or component interactions",
    "e2e: End-to-end full system flow tests",
    "slow: Tests that take >1s (opt-in, excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend = "ruff-base.toml"
line-length = 120
extend-exclude = [
    "archive",
    "qlib-main",
    "scripts",
    "src/alpaca",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E402", "E501", "B008", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001", "F401", "F841"]
"alembic/versions/*.py" = ["I001", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = "(^archive/|^qlib-main/|^scripts/|^tests/|^src/alpaca/|^alembic/)"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["orion.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "orion.clients.heber_reader",
    "orion.main_feature_enrichment",
    "orion.jobs.gateway_contract_probe",
]
ignore_errors = false
strict = true
