x-orion-common: &orion-common
  build: .
  volumes:
    - .:/app
    - ../empire-core:/empire-core:ro
  environment: &orion-env
    PYTHONPATH: /app/src:/empire-core
  networks:
    - default
    - data-gateway

networks:
  data-gateway:
    external: true
    name: data-gateway_default

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: orion_timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_password
      - POSTGRES_DB=orion_db
    ports:
      - "5440:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orion -d orion_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  price_target_labeler:
    <<: *orion-common
    container_name: orion_price_target
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent
      GATEWAY_URL: http://data-gateway:8080
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER: ${ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER:-false}
    command: [ "python", "-m", "orion.main_price_target_labeler" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ingestion:
    <<: *orion-common
    container_name: orion_ingestion
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      ORION_RUN_ID: docker_persistent_ingest
      GATEWAY_URL: http://data-gateway:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.ingestion" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  feature_enrichment:
    <<: *orion-common
    container_name: orion_feature_enrichment
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent
      GATEWAY_URL: http://data-gateway:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
      # Re-enabled with staggered-init connector startup in
      # main_feature_enrichment.py (t=5/75/145/215s offsets). Without UW
      # connector writes, the ML scorer sees null features and rejects every
      # candidate with score 0.00.
      ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH: ${ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH:-true}
      # Disabled by default: HeberReader.read_bars does not push time filters
      # down to parquet, so a 1-day SPY bars read materializes the full silver
      # bars dataset in memory and OOMs this container. Re-enable once Heber
      # reads are partition-pruned. Ticker discovery uses bronze_events (DB).
      ORION_FEATURE_ENRICHMENT_PREFER_HEBER_CONTEXT: ${ORION_FEATURE_ENRICHMENT_PREFER_HEBER_CONTEXT:-false}
    command: [ "python", "-m", "orion.main_feature_enrichment" ]
    # Explicit memory cap: pyarrow Heber scans can balloon. With this cap a
    # runaway read produces an OOMKilled=true + exit 137 signal we can see,
    # instead of Docker Desktop VM-level silent killing.
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  option_quote_tracker:
    <<: *orion-common
    container_name: orion_option_quote_tracker
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ORION_RUN_ID: docker_persistent
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER: ${ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER:-false}
    command: [ "python", "-m", "orion.main_option_quote_tracker" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  execution:
    <<: *orion-common
    container_name: orion_execution
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      ORION_RUN_ID: docker_persistent_exec
      ORION_REQUIRE_ROLLUPS_FOR_SIGNALS_LIVE: "false"
      ORION_RISK_MAX_DAILY_LOSS: ${ORION_RISK_MAX_DAILY_LOSS:-20000}
      GATEWAY_URL: http://data-gateway:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.main_execution" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  position-monitor:
    <<: *orion-common
    container_name: orion_position_monitor
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      execution:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      ORION_RUN_ID: docker_position_monitor
      ORION_MODEL_DIR: /app/models
      GATEWAY_URL: http://data-gateway:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.main_position_monitor", "--interval", "60" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  eod-agent:
    <<: *orion-common
    container_name: orion_eod_agent
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ~/.codex:/root/.codex:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent_eod
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
    command: [ "python", "-m", "orion.main_eod" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-search:
    <<: *orion-common
    container_name: orion_meta_search
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      pattern-miner:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
      ORION_AI_GATEWAY_KEY: ${ORION_AI_GATEWAY_KEY:-empire-ai-gateway-key}
    command: [ "python", "-m", "orion.main_meta", "--base-solver", "${ORION_META_BASE_SOLVER:-diversified_baseline_v1}", "--scheduled" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  data-quality:
    <<: *orion-common
    container_name: orion_data_quality
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
    command: [ "python", "-m", "orion.main_data_quality", "--scheduled" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-weekly:
    <<: *orion-common
    container_name: orion_meta_weekly
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      eod-agent:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
      ORION_AI_GATEWAY_KEY: ${ORION_AI_GATEWAY_KEY:-empire-ai-gateway-key}
    command: [ "python", "-m", "orion.main_meta_weekly", "--scheduled" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  dashboard-reset:
    <<: *orion-common
    container_name: orion_dashboard_reset
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      ORION_API_KEY: ${ORION_API_KEY}
      ORION_API_URL: http://host.docker.internal:8001
    command: [ "python", "-m", "orion.jobs.daily_dashboard_reset", "--scheduled" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  pattern-miner:
    <<: *orion-common
    container_name: orion_pattern_miner
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_PATTERN_MINER: ${ORION_ENABLE_LEGACY_PATTERN_MINER:-true}
      ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING: ${ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING:-true}
      ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING: ${ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING:-true}
      ORION_PATTERN_MINER_TRAINING_SOURCE: ${ORION_PATTERN_MINER_TRAINING_SOURCE:-heber_gold}
      ORION_EXIT_CLASSIFIER_TRAINING_SOURCE: ${ORION_EXIT_CLASSIFIER_TRAINING_SOURCE:-heber_gold}
    command: [ "python", "-m", "orion.main_pattern_miner" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nightly-backfill:
    <<: *orion-common
    container_name: orion_nightly_backfill
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_nightly_backfill
      GATEWAY_URL: http://data-gateway:8080
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL: ${ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL:-false}
    command: [ "python", "-m", "orion.jobs.nightly_backfill" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  quality-guardrails:
    <<: *orion-common
    container_name: orion_quality_guardrails
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_quality_guardrails
      ORION_GUARDRAIL_LOOP_SECONDS: ${ORION_GUARDRAIL_LOOP_SECONDS:-60}
      ORION_RECONCILE_INTERVAL_SECONDS: ${ORION_RECONCILE_INTERVAL_SECONDS:-3600}
      ORION_RECONCILE_LOOKBACK_DAYS: ${ORION_RECONCILE_LOOKBACK_DAYS:-7}
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS: ${ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS:-false}
      ORION_QUALITY_CHECK_INTERVAL_SECONDS: ${ORION_QUALITY_CHECK_INTERVAL_SECONDS:-1800}
      ORION_FEATURE_VALIDATE_INTERVAL_SECONDS: ${ORION_FEATURE_VALIDATE_INTERVAL_SECONDS:-3600}
    command: [ "python", "-m", "orion.jobs.quality_guardrails" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  indexer:
    <<: *orion-common
    container_name: orion_indexer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: [ "python", "-m", "orion.rag.indexer", "--daemon", "--interval", "600" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  heber-sync:
    image: alpine:3.19
    container_name: orion_heber_sync
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache rsync coreutils >/dev/null 2>&1
        echo "heber-sync: starting continuous sync (60s interval)"
        while true; do
          TODAY=$$(date -u +%Y-%m-%d)
          YESTERDAY=$$(date -u -d "@$$(( $$(date -u +%s) - 86400 ))" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          # Gold cutoff: 30 days back. Orion ML rolling windows are <=30d, so a
          # tighter window is enough; without it the EOD pollers Heber writes
          # to gold/dataset=*/project=*/version=*/dt=*/ remain invisible to
          # Orion's container (which only sees /heber-cache).
          GOLD_CUTOFF=$$(date -u -d "@$$(( $$(date -u +%s) - 30*86400 ))" +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
          FEEDS="flow_alerts bars darkpool market_tide greek_exposure iv_rank max_pain"
          SYNCED=0
          for feed in $$FEEDS; do
            SRC_BASE="/heber-source/silver/feed=$$feed"
            DST_BASE="/heber-cache/silver/feed=$$feed"
            if [ -d "$$SRC_BASE" ]; then
              # Sync date partitions (today + yesterday) for each instrument_type
              for itype_dir in "$$SRC_BASE"/instrument_type=*; do
                [ -d "$$itype_dir" ] || continue
                itype=$$(basename "$$itype_dir")
                for dt in "$$TODAY" "$$YESTERDAY"; do
                  if [ -d "$$itype_dir/dt=$$dt" ]; then
                    mkdir -p "$$DST_BASE/$$itype/dt=$$dt"
                    rsync -a "$$itype_dir/dt=$$dt/" "$$DST_BASE/$$itype/dt=$$dt/"
                    SYNCED=$$((SYNCED + 1))
                  fi
                done
              done
            fi
          done

          # Gold sync: walk every dataset/project/version, mirror dt= partitions
          # newer than GOLD_CUTOFF. Use --delete so renamed/removed parquet
          # files in source (e.g. quarantined legacy schemas) don't linger
          # in the cache and pollute downstream pyarrow merges.
          GOLD_SRC="/heber-source/gold"
          GOLD_DST="/heber-cache/gold"
          GOLD_SYNCED=0
          if [ -d "$$GOLD_SRC" ]; then
            for ds_dir in "$$GOLD_SRC"/dataset=*; do
              [ -d "$$ds_dir" ] || continue
              ds=$$(basename "$$ds_dir")
              for proj_dir in "$$ds_dir"/project=*; do
                [ -d "$$proj_dir" ] || continue
                proj=$$(basename "$$proj_dir")
                for ver_dir in "$$proj_dir"/version=*; do
                  [ -d "$$ver_dir" ] || continue
                  ver=$$(basename "$$ver_dir")
                  for dt_dir in "$$ver_dir"/dt=*; do
                    [ -d "$$dt_dir" ] || continue
                    dt_part=$$(basename "$$dt_dir")
                    dt_value=$${dt_part#dt=}
                    if [ "$$dt_value" \< "$$GOLD_CUTOFF" ]; then
                      continue
                    fi
                    DEST_DIR="$$GOLD_DST/$$ds/$$proj/$$ver/$$dt_part"
                    mkdir -p "$$DEST_DIR"
                    rsync -a --delete "$$dt_dir/" "$$DEST_DIR/" >/dev/null 2>&1
                    GOLD_SYNCED=$$((GOLD_SYNCED + 1))
                  done
                done
              done
            done
          fi

          echo "$$(date -u +%H:%M:%S) synced silver=$$SYNCED gold=$$GOLD_SYNCED partitions"
          sleep 60
        done
    volumes:
      - /Volumes/heber/data:/heber-source:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/heber-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescaledb_data:
