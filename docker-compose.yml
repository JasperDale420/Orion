x-orion-common: &orion-common
  build: .
  volumes:
    - .:/app
    - ../empire-core:/empire-core:ro
  environment: &orion-env
    PYTHONPATH: /app/src:/empire-core

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: orion_timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_password
      - POSTGRES_DB=orion_db
    ports:
      - "5440:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orion -d orion_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  price_target_labeler:
    <<: *orion-common
    container_name: orion_price_target
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent
      GATEWAY_URL: http://host.docker.internal:8080
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER: ${ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER:-false}
    command: [ "python", "-m", "orion.main_price_target_labeler" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ingestion:
    <<: *orion-common
    container_name: orion_ingestion
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_PAPER: ${ALPACA_PAPER}
      ORION_RUN_ID: docker_persistent_ingest
      GATEWAY_URL: http://host.docker.internal:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.ingestion" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  feature_enrichment:
    <<: *orion-common
    container_name: orion_feature_enrichment
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent
      GATEWAY_URL: http://host.docker.internal:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
      ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH: ${ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH:-true}
    command: [ "python", "-m", "orion.main_feature_enrichment" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  option_quote_tracker:
    <<: *orion-common
    container_name: orion_option_quote_tracker
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ORION_RUN_ID: docker_persistent
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER: ${ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER:-false}
    command: [ "python", "-m", "orion.main_option_quote_tracker" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  execution:
    <<: *orion-common
    container_name: orion_execution
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_PAPER: ${ALPACA_PAPER}
      ORION_RUN_ID: docker_persistent_exec
      ORION_REQUIRE_ROLLUPS_FOR_SIGNALS_LIVE: "false"
      GATEWAY_URL: http://host.docker.internal:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.main_execution" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  position-monitor:
    <<: *orion-common
    container_name: orion_position_monitor
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      execution:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_PAPER: ${ALPACA_PAPER}
      ORION_RUN_ID: docker_position_monitor
      ORION_MODEL_DIR: /app/models
      GATEWAY_URL: http://host.docker.internal:8080
      GATEWAY_API_KEY: ${DATA_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
    command: [ "python", "-m", "orion.main_position_monitor", "--interval", "60" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  eod-agent:
    <<: *orion-common
    container_name: orion_eod_agent
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ~/.codex:/root/.codex:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_persistent_eod
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
    command: [ "python", "-m", "orion.main_eod" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-search:
    <<: *orion-common
    container_name: orion_meta_search
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      pattern-miner:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
      ORION_AI_GATEWAY_KEY: ${ORION_AI_GATEWAY_KEY:-empire-ai-gateway-key}
    command: [ "python", "-m", "orion.main_meta", "--base-solver", "${ORION_META_BASE_SOLVER:-diversified_baseline_v1}", "--scheduled" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  data-quality:
    <<: *orion-common
    container_name: orion_data_quality
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
    command: [ "python", "-m", "orion.main_data_quality", "--scheduled" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-weekly:
    <<: *orion-common
    container_name: orion_meta_weekly
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      eod-agent:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ORION_AI_GATEWAY_URL: http://host.docker.internal:8002/v1
      ORION_AI_GATEWAY_KEY: ${ORION_AI_GATEWAY_KEY:-empire-ai-gateway-key}
    command: [ "python", "-m", "orion.main_meta_weekly", "--scheduled" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  dashboard-reset:
    <<: *orion-common
    container_name: orion_dashboard_reset
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      ORION_API_KEY: ${ORION_API_KEY}
      ORION_API_URL: http://mcp-server:8001
    command: [ "python", "-m", "orion.jobs.daily_dashboard_reset", "--scheduled" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  pattern-miner:
    <<: *orion-common
    container_name: orion_pattern_miner
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ../empire-core:/empire-core:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/Volumes/heber/data:ro
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_PATTERN_MINER: ${ORION_ENABLE_LEGACY_PATTERN_MINER:-true}
      ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING: ${ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING:-true}
      ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING: ${ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING:-true}
      ORION_PATTERN_MINER_TRAINING_SOURCE: ${ORION_PATTERN_MINER_TRAINING_SOURCE:-heber_gold}
      ORION_EXIT_CLASSIFIER_TRAINING_SOURCE: ${ORION_EXIT_CLASSIFIER_TRAINING_SOURCE:-heber_gold}
    command: [ "python", "-m", "orion.main_pattern_miner" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nightly-backfill:
    <<: *orion-common
    container_name: orion_nightly_backfill
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_nightly_backfill
      GATEWAY_URL: http://host.docker.internal:8080
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL: ${ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL:-false}
    command: [ "python", "-m", "orion.jobs.nightly_backfill" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  quality-guardrails:
    <<: *orion-common
    container_name: orion_quality_guardrails
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      ORION_RUN_ID: docker_quality_guardrails
      ORION_GUARDRAIL_LOOP_SECONDS: ${ORION_GUARDRAIL_LOOP_SECONDS:-60}
      ORION_RECONCILE_INTERVAL_SECONDS: ${ORION_RECONCILE_INTERVAL_SECONDS:-3600}
      ORION_RECONCILE_LOOKBACK_DAYS: ${ORION_RECONCILE_LOOKBACK_DAYS:-7}
      ORION_ENABLE_LEGACY_LABEL_PIPELINES: ${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS: ${ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS:-false}
      ORION_QUALITY_CHECK_INTERVAL_SECONDS: ${ORION_QUALITY_CHECK_INTERVAL_SECONDS:-1800}
      ORION_FEATURE_VALIDATE_INTERVAL_SECONDS: ${ORION_FEATURE_VALIDATE_INTERVAL_SECONDS:-3600}
    command: [ "python", "-m", "orion.jobs.quality_guardrails" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  indexer:
    <<: *orion-common
    container_name: orion_indexer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      <<: *orion-env
      DB_URL: postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: [ "python", "-m", "orion.rag.indexer", "--daemon", "--interval", "600" ]
    healthcheck:
      test: [ "CMD-SHELL", "kill -0 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mcp-server:
    build: ../Shared-MCP-Server
    container_name: orion_mcp_server
    restart: unless-stopped
    ports:
      - "8090:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_TRANSPORT=sse
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_API_KEY_HEADER=${MCP_API_KEY_HEADER:-X-MCP-API-Key}
      - MCP_AUTH_REQUIRED=${MCP_AUTH_REQUIRED:-false}
      - UW_API_KEY=${UW_API_KEY}
      - SEC_CONTACT_EMAIL=${SEC_CONTACT_EMAIL:-alerts@empire.local}
      - APCA_API_KEY_ID=${ALPACA_API_KEY}
      - APCA_API_SECRET_KEY=${ALPACA_SECRET_KEY}
      - APCA_API_BASE_URL=https://paper-api.alpaca.markets
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  heber-sync:
    image: alpine:3.19
    container_name: orion_heber_sync
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache rsync >/dev/null 2>&1
        echo "heber-sync: starting continuous sync (60s interval)"
        while true; do
          TODAY=$$(date -u +%Y-%m-%d)
          YESTERDAY=$$(date -u -d "@$$(( $$(date -u +%s) - 86400 ))" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          FEEDS="flow_alerts bars darkpool market_tide greek_exposure iv_rank max_pain"
          SYNCED=0
          for feed in $$FEEDS; do
            SRC_BASE="/heber-source/silver/feed=$$feed"
            DST_BASE="/heber-cache/silver/feed=$$feed"
            if [ -d "$$SRC_BASE" ]; then
              # Sync date partitions (today + yesterday) for each instrument_type
              for itype_dir in "$$SRC_BASE"/instrument_type=*; do
                [ -d "$$itype_dir" ] || continue
                itype=$$(basename "$$itype_dir")
                for dt in "$$TODAY" "$$YESTERDAY"; do
                  if [ -d "$$itype_dir/dt=$$dt" ]; then
                    mkdir -p "$$DST_BASE/$$itype/dt=$$dt"
                    rsync -a "$$itype_dir/dt=$$dt/" "$$DST_BASE/$$itype/dt=$$dt/"
                    SYNCED=$$((SYNCED + 1))
                  fi
                done
              done
            fi
          done
          echo "$$(date -u +%H:%M:%S) synced $$SYNCED partitions"
          sleep 60
        done
    volumes:
      - /Volumes/heber/data:/heber-source:ro
      - ${HEBER_HOST_DATA:-/Users/jacobmcmillan/.heber-cache/data}:/heber-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescaledb_data:
