services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: orion_timescaledb
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_password
      - POSTGRES_DB=orion_db
    ports:
      - "5440:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orion -d orion_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    image: minio/minio:latest
    container_name: orion_minio
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set orion http://minio:9000 minio_admin minio_password; /usr/bin/mc mb orion/lakehouse --ignore-existing; /usr/bin/mc anonymous set public orion/lakehouse; exit 0; "

  price_target_labeler:
    build: .
    container_name: orion_price_target
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - /Volumes/heber/data:/Volumes/heber/data:ro
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ORION_RUN_ID=docker_persistent
      - GATEWAY_URL=http://host.docker.internal:8080
      - ORION_ENABLE_LEGACY_LABEL_PIPELINES=${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      - ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER=${ORION_ENABLE_LEGACY_PRICE_TARGET_LABELER:-false}
    command: [ "python", "-m", "orion.main_price_target_labeler" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  feature_enrichment:
    build: .
    container_name: orion_feature_enrichment
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - /Volumes/heber/data:/Volumes/heber/data:ro
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - UW_API_KEY=${UW_API_KEY}
      - ORION_RUN_ID=docker_persistent
      - GATEWAY_URL=http://host.docker.internal:8080
      - GATEWAY_API_KEY=${DATA_GATEWAY_API_KEY:-}
      - ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH=${ORION_FEATURE_ENRICHMENT_ENABLE_GATEWAY_FETCH:-false}
    command: [ "python", "-m", "orion.main_feature_enrichment" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  option_quote_tracker:
    build: .
    container_name: orion_option_quote_tracker
    profiles: [ "legacy-labels" ]
    restart: on-failure
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ORION_RUN_ID=docker_persistent
      - ORION_ENABLE_LEGACY_LABEL_PIPELINES=${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      - ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER=${ORION_ENABLE_LEGACY_OPTION_QUOTE_TRACKER:-false}
    command: [ "python", "-m", "orion.main_option_quote_tracker" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  execution:
    build: .
    container_name: orion_execution
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - /Volumes/heber/data:/Volumes/heber/data:ro
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER}
      - ORION_RUN_ID=docker_persistent_exec
      - ORION_REQUIRE_ROLLUPS_FOR_SIGNALS_LIVE=false
    command: [ "python", "-m", "orion.main_execution" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  position-monitor:
    build: .
    container_name: orion_position_monitor
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      execution:
        condition: service_started
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER}
      - ORION_RUN_ID=docker_position_monitor
      - ORION_MODEL_DIR=/app/models
    command: [ "python", "-m", "orion.main_position_monitor", "--interval", "60" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  eod-agent:
    build: .
    container_name: orion_eod_agent
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - ~/.codex:/root/.codex:ro # Mount host codex credentials (read-only)
      - /Volumes/heber/data:/Volumes/heber/data:ro
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ORION_RUN_ID=docker_persistent_eod
      - ORION_REASONING_LEVEL=extra_high
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-reasoner}
    command: [ "python", "-m", "orion.main_eod" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-search:
    build: .
    container_name: orion_meta_search
    profiles: [ "tools" ]
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: [ "python", "-m", "orion.main_meta", "--base-solver", "v1_legacy" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  meta-weekly:
    build: .
    container_name: orion_meta_weekly
    profiles: [ "scheduled" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      eod-agent:
        condition: service_started
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    command: [ "python", "-m", "orion.main_meta_weekly", "--scheduled" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  pattern-miner:
    build: .
    container_name: orion_pattern_miner
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ORION_ENABLE_LEGACY_LABEL_PIPELINES=${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      - ORION_ENABLE_LEGACY_PATTERN_MINER=${ORION_ENABLE_LEGACY_PATTERN_MINER:-true}
      - ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING=${ORION_ENABLE_LEGACY_PATTERN_MINER_TRAINING:-true}
      - ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING=${ORION_ENABLE_LEGACY_EXIT_CLASSIFIER_TRAINING:-true}
      - ORION_PATTERN_MINER_TRAINING_SOURCE=${ORION_PATTERN_MINER_TRAINING_SOURCE:-heber_gold}
      - ORION_EXIT_CLASSIFIER_TRAINING_SOURCE=${ORION_EXIT_CLASSIFIER_TRAINING_SOURCE:-heber_gold}
    command: [ "python", "-m", "orion.main_pattern_miner" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nightly-backfill:
    build: .
    container_name: orion_nightly_backfill
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ORION_RUN_ID=docker_nightly_backfill
      - GATEWAY_URL=http://host.docker.internal:8080
      - ORION_ENABLE_LEGACY_LABEL_PIPELINES=${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      - ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL=${ORION_ENABLE_LEGACY_NIGHTLY_BACKFILL:-false}
    command: [ "python", "-m", "orion.jobs.nightly_backfill" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  quality-guardrails:
    build: .
    container_name: orion_quality_guardrails
    profiles: [ "legacy-labels" ]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      price_target_labeler:
        condition: service_started
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - ORION_RUN_ID=docker_quality_guardrails
      - ORION_GUARDRAIL_LOOP_SECONDS=${ORION_GUARDRAIL_LOOP_SECONDS:-60}
      - ORION_RECONCILE_INTERVAL_SECONDS=${ORION_RECONCILE_INTERVAL_SECONDS:-3600}
      - ORION_RECONCILE_LOOKBACK_DAYS=${ORION_RECONCILE_LOOKBACK_DAYS:-7}
      - ORION_ENABLE_LEGACY_LABEL_PIPELINES=${ORION_ENABLE_LEGACY_LABEL_PIPELINES:-false}
      - ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS=${ORION_ENABLE_LEGACY_QUALITY_GUARDRAILS:-false}
      - ORION_QUALITY_CHECK_INTERVAL_SECONDS=${ORION_QUALITY_CHECK_INTERVAL_SECONDS:-1800}
      - ORION_FEATURE_VALIDATE_INTERVAL_SECONDS=${ORION_FEATURE_VALIDATE_INTERVAL_SECONDS:-3600}
    command: [ "python", "-m", "orion.jobs.quality_guardrails" ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  indexer:
    build: .
    container_name: orion_indexer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://orion:orion_password@timescaledb:5432/orion_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: [ "python", "-m", "orion.rag.indexer", "--daemon", "--interval", "600" ]
    # 600s = 10 minutes interval
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: orion_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy|OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mcp-server:
    build: ../Shared-MCP-Server
    container_name: orion_mcp_server
    restart: unless-stopped
    ports:
      - "8090:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_TRANSPORT=sse
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_API_KEY_HEADER=${MCP_API_KEY_HEADER:-X-MCP-API-Key}
      - MCP_AUTH_REQUIRED=${MCP_AUTH_REQUIRED:-false}
      - UW_API_KEY=${UW_API_KEY}
      - SEC_CONTACT_EMAIL=${SEC_CONTACT_EMAIL:-alerts@empire.local}
      - APCA_API_KEY_ID=${ALPACA_API_KEY}
      - APCA_API_SECRET_KEY=${ALPACA_SECRET_KEY}
      - APCA_API_BASE_URL=https://paper-api.alpaca.markets
    # No healthcheck exposed by default, rely on TCP
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  timescaledb_data:
  minio_data:
  redpanda_data:
