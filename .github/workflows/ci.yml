name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Check out empire-core (monorepo path dependency)
      # Orion's pyproject pins empire-core as an editable path dep at
      # ../empire-core (a sibling in the local monorepo). In CI only Orion is
      # checked out, so `uv sync` fails with "Distribution not found at
      # .../empire-core" unless we materialise empire-core at the sibling path.
      # empire-core is private, so the default github.token cannot read it
      # across repos — reuse DATA_GATEWAY_CHECKOUT_TOKEN (it must also have
      # "Contents: read" on JasperDale420/empire-core). actions/checkout cannot
      # target a path outside $GITHUB_WORKSPACE, so clone manually into the
      # parent directory, which is exactly where ../empire-core resolves.
      env:
        EMPIRE_CORE_TOKEN: ${{ secrets.DATA_GATEWAY_CHECKOUT_TOKEN }}
      run: |
        git clone --depth 1 \
          "https://x-access-token:${EMPIRE_CORE_TOKEN}@github.com/JasperDale420/empire-core.git" \
          "${GITHUB_WORKSPACE}/../empire-core"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run Hygiene (Pre-commit)
      run: |
        uv run pre-commit run --all-files

    - name: Check out Data-Gateway (for cross-repo contract tests)
      # tests/contracts/ verifies that Orion's GatewayTradingClient matches
      # Gateway's FastAPI signatures — see the 2026-05-22 incident
      # (Orion commit 51699c8) where Orion was sending order fields in the
      # JSON body while Gateway declared them as query params, 422-ing 100%
      # of live order submissions. The test refuses to silent-skip in CI;
      # if this checkout fails, the test job fails with it.
      #
      # Data-Gateway is private — default github.token cannot read it
      # across repos. Set a PAT (or fine-grained token with "Contents: read"
      # on JasperDale420/Data-Gateway) as repo secret
      # DATA_GATEWAY_CHECKOUT_TOKEN. Without it, the checkout 404s and the
      # job fails with a clear message.
      uses: actions/checkout@v6
      with:
        repository: JasperDale420/Data-Gateway
        path: data-gateway
        token: ${{ secrets.DATA_GATEWAY_CHECKOUT_TOKEN || github.token }}

    - name: Run Tests
      # Ensure coverage.xml is generated.
      #
      # tests/e2e/ is excluded: those tests connect to a real TimescaleDB on
      # port 5440 (and exercise the full migrated schema), which CI does not
      # provision. They are local/real-infra verification — see
      # docs/testing-guide.md. Follow-up: add a timescaledb service container +
      # `alembic upgrade head` to run e2e in CI.
      env:
        # tests/contracts/test_create_order_contract.py reads this to locate
        # the Gateway repo. Set to the checkout path from the prior step.
        DATA_GATEWAY_REPO: ${{ github.workspace }}/data-gateway
        # Convert "Gateway repo missing" from a soft skip into a hard
        # failure — the contract test exists specifically to catch
        # cross-repo signature drift, and silent-skip in CI defeats that.
        ORION_CONTRACT_TESTS_REQUIRE_GATEWAY: "1"
      run: |
        uv run pytest -v --cov=src --cov-report=xml --junitxml=test-results.xml --ignore=tests/e2e

    - name: SonarQube Analysis
      if: env.SONAR_TOKEN != ''
      uses: sonarsource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


    - name: Generate SBOM
      run: |
        uv run --with cyclonedx-bom cyclonedx-py environment -o sbom.json

    - name: Upload SBOM
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sbom-${{ matrix.python-version }}
        path: sbom.json
        if-no-files-found: ignore

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        if-no-files-found: ignore
