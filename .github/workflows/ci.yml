name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # setup-uv ships a Node 20 JS action; GitHub now warns Node 20 is deprecated.
  # This flag forces JS actions onto Node 24 and clears the warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      # Postgres 16 + pgvector — matches production (RC.2). Orion uses no
      # TimescaleDB-specific features; the only extension that matters is pgvector
      # (RAG embeddings, Vector(768)). The `timescaledb` service key is retained
      # for parity with docker-compose's service name.
      timescaledb:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion_password  # pragma: allowlist secret
          POSTGRES_DB: orion_db
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U orion -d orion_db"
          --health-interval 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Validate docker-compose profiles
      # Cheap, no docker daemon needed — `docker compose config` is pure YAML
      # rendering + interpolation + profile resolution. ubuntu-latest ships the
      # Compose v2 plugin. Catches invalid renders like a depends_on targeting a
      # service in a different profile (Finding 5: meta-weekly → eod-agent). All
      # four profile renders Orion actually deploys must exit 0.
      run: |
        docker compose config -q
        docker compose --profile docker config -q
        docker compose --profile scheduled config -q
        docker compose --profile legacy-labels config -q

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Materialise empire-core (monorepo path dependency)
      # Orion's pyproject pins empire-core as an editable path dep at
      # ../empire-core (a sibling in the local monorepo). In CI only Orion is
      # checked out, so `uv sync` fails with "Distribution not found at
      # .../empire-core" unless we materialise empire-core at the sibling path.
      # We copy the vendored CI copy at ci/empire_core/ into ../empire-core.
      # This is secret-free (empire-core is private and the default github.token
      # cannot read it across repos). Keep ci/empire_core/ in sync with the real
      # empire-core when its public surface changes.
      run: |
        cp -r ci/empire_core "${GITHUB_WORKSPACE}/../empire-core"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run Hygiene (Pre-commit)
      run: |
        uv run pre-commit run --all-files

    - name: Type Check
      run: uv run mypy src/orion

    - name: Check out Data-Gateway (for cross-repo contract tests)
      # tests/contracts/ verifies that Orion's GatewayTradingClient matches
      # Gateway's FastAPI signatures — see the 2026-05-22 incident
      # (Orion commit 51699c8) where Orion was sending order fields in the
      # JSON body while Gateway declared them as query params, 422-ing 100%
      # of live order submissions. The test refuses to silent-skip in CI;
      # if this checkout fails, the test job fails with it.
      #
      # Data-Gateway is private — default github.token cannot read it
      # across repos. Set a PAT (or fine-grained token with "Contents: read"
      # on JasperDale420/Data-Gateway) as repo secret
      # DATA_GATEWAY_CHECKOUT_TOKEN. Without it, the checkout 404s and the
      # job fails with a clear message.
      uses: actions/checkout@v7
      with:
        repository: JasperDale420/Data-Gateway
        path: data-gateway
        token: ${{ secrets.DATA_GATEWAY_CHECKOUT_TOKEN || github.token }}

    - name: Run Tests
      # Ensure coverage.xml is generated.
      #
      # tests/e2e/ is excluded here: those tests connect to a real Postgres on
      # port 5440 (and exercise the full migrated schema), which the in-process
      # SQLite test suite does not provision. They run in the dedicated
      # "Run E2E smoke (real TimescaleDB)" step below, which provisions the
      # `timescaledb` service container and applies `alembic upgrade head`
      # first. See docs/testing-guide.md.
      env:
        # tests/contracts/test_create_order_contract.py reads this to locate
        # the Gateway repo. Set to the checkout path from the prior step.
        DATA_GATEWAY_REPO: ${{ github.workspace }}/data-gateway
        # Convert "Gateway repo missing" from a soft skip into a hard
        # failure — the contract test exists specifically to catch
        # cross-repo signature drift, and silent-skip in CI defeats that.
        ORION_CONTRACT_TESTS_REQUIRE_GATEWAY: "1"
      run: |
        uv run pytest -v --cov=src --cov-report=xml --junitxml=test-results.xml --ignore=tests/e2e

    - name: Run E2E smoke (real TimescaleDB)
      # Runs against the `timescaledb` service container (pgvector/pgvector:pg16,
      # mapped to localhost:5440 — see services: block). Bootstraps the schema
      # with plain `alembic upgrade head`. As of the 2026-06-11 baseline squash
      # (see archive/2026-06-11_alembic-pre-baseline/), the migration chain is a
      # single baseline revision whose upgrade() runs `CREATE EXTENSION IF NOT
      # EXISTS vector` and then creates the full schema — so a fresh, empty
      # database is now fully migration-driven. (init_db()'s create_all path
      # still exists and is used by the in-memory SQLite unit suite, but is no
      # longer needed to bootstrap a real Postgres DB here.)
      # test_live_data_flow.py is deliberately NOT run: it is a
      # live-market-data freshness check and is meaningless against an empty CI
      # database.
      #
      # alembic reads its URL from alembic.ini's hardcoded
      #   sqlalchemy.url = postgresql+asyncpg://orion:orion_password@127.0.0.1:5440/orion_db
      # (alembic/env.py does NOT consult DB_URL); the tests read DB_URL. Both
      # resolve to the same service container.
      #
      # ORION_RUN_LIVE_DB_SMOKE=1 is REQUIRED: test_smoke_e2e_real_db skips
      # itself unless this opt-in is set, so without it the smoke test would
      # silently no-op.
      env:
        DB_URL: postgresql+asyncpg://orion:orion_password@localhost:5440/orion_db  # pragma: allowlist secret
        ORION_RUN_LIVE_DB_SMOKE: "1"
      run: |
        uv run alembic upgrade head
        uv run pytest tests/e2e/test_smoke_e2e.py tests/e2e/test_postgres_dialect.py -v

    - name: SonarQube Analysis
      if: env.SONAR_TOKEN != ''
      uses: sonarsource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


    - name: Generate SBOM
      run: |
        uv run --with cyclonedx-bom cyclonedx-py environment -o sbom.json

    - name: Upload SBOM
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sbom-${{ matrix.python-version }}
        path: sbom.json
        if-no-files-found: ignore

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
        if-no-files-found: ignore
