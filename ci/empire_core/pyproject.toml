# CI-installable vendor copy of empire-core.
#
# In the full monorepo, empire-core lives at ../empire-core and uv resolves it
# via [tool.uv.sources]. CI checks out this repo standalone, so the sibling
# package isn't available. This vendor copy provides the empire_core modules
# imported by this repo (errors, logger, excursion, ledger, http_client, config).
#
# CI installs it with:  pip install ci/empire_core/
# Local development uses the real package via uv (../empire-core).
# Keep in sync with ../empire-core when its public surface changes.

[project]
name = "empire-core"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["empire_core"]
